# Lamsa API behind Nginx: an EXAMPLE for a later deployment (not deployed by anything here).
# Include it in the http {} context (e.g. /etc/nginx/conf.d/lamsa.conf). Validated with
#   docker run --rm -v ./docker/nginx/lamsa.conf:/etc/nginx/conf.d/default.conf:ro \
#     --add-host host.docker.internal:host-gateway nginx:<pinned> nginx -t
#
# The API must run with TRUST_PROXY_HEADERS=true behind this proxy ONLY: X-Forwarded-For is
# overwritten below with the real client address, so clients cannot spoof it.

upstream lamsa_api {
    # Production: the Uvicorn/Gunicorn workers on this host. Local docker profile: the host machine.
    server host.docker.internal:8000;
    keepalive 32;
}

# Micro-cache (2 s) for anonymous catalog GETs: absorbs spikes such as the minutes right after a
# push campaign. The API's own cache stays the source of these responses.
proxy_cache_path /var/cache/nginx/lamsa levels=1:2 keys_zone=lamsa_micro:10m max_size=100m inactive=10m use_temp_path=off;

# Per-IP rate limits: strict for authentication, general for everything else.
limit_req_zone $binary_remote_addr zone=lamsa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lamsa_api:10m rate=30r/s;
limit_req_status 429;

# Never micro-cache personalised or explicitly uncached requests.
map $http_authorization $lamsa_has_auth { default 1; "" 0; }
map $http_cookie $lamsa_has_cookie { default 1; "" 0; }
map $http_cache_control $lamsa_no_cache_header { default 0; ~*no-cache 1; ~*no-store 1; }
map "$lamsa_has_auth$lamsa_has_cookie$lamsa_no_cache_header" $lamsa_skip_micro_cache { default 1; "000" 0; }

server {
    listen 80;
    server_name _;

    # Uploads: up to 8 images of MAX_UPLOAD_MB (5) per request, plus multipart overhead.
    client_max_body_size 42m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    # Brotli needs the ngx_brotli module (not in the official image). If available:
    # brotli on; brotli_comp_level 5; brotli_types application/json text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append (TRUST_PROXY_HEADERS)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;

    # 429 in the API's JSON error format.
    error_page 429 = @lamsa_rate_limited;
    location @lamsa_rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"TOO_MANY_ATTEMPTS","message":"محاولات كثيرة. حاول مرة أخرى بعد قليل.","details":{"retry_after":10}}}';
    }

    # Image files straight from MEDIA_ROOT: unique names per upload, so cached for a year.
    location /media/ {
        alias /srv/lamsa/media/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/api/v1/auth/(login|register|google) {
        limit_req zone=lamsa_auth burst=5 nodelay;
        proxy_pass http://lamsa_api;
    }

    location ~ ^/api/v1/(categories|brands|banners|products) {
        limit_req zone=lamsa_api burst=60 nodelay;
        proxy_cache lamsa_micro;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # The API's Cache-Control (max-age 30-300 s) is for clients; this layer keeps 2 s only.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 2s;
        proxy_cache_bypass $lamsa_skip_micro_cache;
        proxy_no_cache $lamsa_skip_micro_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://lamsa_api;
    }

    location / {
        limit_req zone=lamsa_api burst=60 nodelay;
        proxy_pass http://lamsa_api;
    }
}
