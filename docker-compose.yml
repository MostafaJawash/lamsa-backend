# Development services. MySQL runs natively (see README); this file only adds the cache and,
# optionally, the Nginx proxy for local experiments. Nothing here is a production deployment.
#
#   docker compose up -d valkey                 # the cache (CACHE_URL=redis://127.0.0.1:6379/0)
#   docker compose --profile proxy up -d nginx  # optional: try docker/nginx/lamsa.conf locally

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    # Cache only: no persistence, evict least-recently-used keys at 256 MB.
    command:
      - valkey-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"  # never exposed beyond this machine
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional local reverse proxy (profile "proxy"). The API must run on the host at port 8000:
  #   fastapi run app/main.py --port 8000 --no-proxy-headers
  # nginx:
  #   image: nginx:1.30.1-alpine
  #   profiles: ["proxy"]
  #   ports:
  #     - "127.0.0.1:8080:80"
  #   volumes:
  #     - ./docker/nginx/lamsa.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./media:/srv/lamsa/media:ro
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   restart: unless-stopped

volumes:
  valkey-data:
